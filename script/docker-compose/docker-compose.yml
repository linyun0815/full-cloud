# 芋道 Cloud 微服务版 Docker Compose：gateway + system-server + infra-server
# Nacos、MySQL、Redis、Nginx 复用服务器上已部署的服务，本编排不启动内置中间件
# 使用说明见同目录 README.md
# 本文件中的相对路径，均相对于本文件所在目录，与执行命令时的当前目录无关

name: full-cloud

# 所有 Java 服务共用：profile、JVM 参数、Nacos 注册中心 + 配置中心
x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
  JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx512m}
  SPRING_CLOUD_NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
  SPRING_CLOUD_NACOS_USERNAME: ${NACOS_USERNAME:-}
  SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_PASSWORD:-}
  SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: ${NACOS_NAMESPACE:-public}
  SPRING_CLOUD_NACOS_DISCOVERY_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
  SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: ${NACOS_NAMESPACE:-public}
  SPRING_CLOUD_NACOS_CONFIG_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}

# system-server、infra-server 共用：数据库、Redis，以及 application-dev.yaml 中需要关闭的外部依赖
x-app-env: &app-env
  <<: *common-env
  # 数据库：主库、从库都要覆盖，否则会使用 application-${SPRING_PROFILES_ACTIVE}.yaml 中的 127.0.0.1
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-ruoyi-vue-pro}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: ${MYSQL_USER:-yudao}
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_URL: jdbc:mysql://${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-ruoyi-vue-pro}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_USERNAME: ${MYSQL_USER:-yudao}
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
  # Redis：Spring Boot 4.x 使用 spring.data.redis.*
  SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
  SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
  SPRING_DATA_REDIS_DATABASE: ${REDIS_DATABASE:-1}
  # application-dev.yaml 默认连接 127.0.0.1:9090 的 XXL-Job 调度中心，入门部署不提供，关闭执行器
  XXL_JOB_ENABLED: "false"
  # application-dev.yaml 默认开启演示模式（禁止写操作），这里关闭
  FULL_DEMO: "false"

services:
  gateway:
    # 使用同目录通用 Dockerfile，jar 放在 gateway-server/ 下
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: gateway-server/full-gateway.jar
        APP_PORT: "48080"
    image: full-gateway:${IMAGE_TAG:-local}
    restart: unless-stopped
    networks:
      - baota_net
    environment:
      <<: *common-env
    # 供宿主机已安装的 Nginx 反向代理；只绑定回环地址，不直接对外
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-48080}:48080"

  system-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: system-server/full-module-system-server.jar
        APP_PORT: "48081"
    image: full-module-system-server:${IMAGE_TAG:-local}
    restart: unless-stopped
    networks:
      - baota_net
    environment:
      <<: *app-env
      # 需与前端打包时的 VITE_APP_CAPTCHA_ENABLE 一致
      FULL_CAPTCHA_ENABLE: ${FULL_CAPTCHA_ENABLE:-true}

  infra-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: infra-server/full-module-infra-server.jar
        APP_PORT: "48082"
    image: full-module-infra-server:${IMAGE_TAG:-local}
    restart: unless-stopped
    networks:
      - baota_net
    environment:
      <<: *app-env

networks:
  # 服务器已有 Nacos/MySQL/Redis 所在网络；本地首次运行时需先 docker network create baota_net
  baota_net:
    external: true
    name: ${SHARED_NETWORK:-baota_net}
